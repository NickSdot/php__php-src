name: Download PHP build
description: Download and restore a PHP build produced in this workflow run
inputs:
  name:
    description: Artifact name, unique within the workflow run
    required: true
  source_sha:
    description: Commit expected in the downloaded build
    required: true
  producer_job:
    description: Job that creates the artifact in this workflow run
    required: true
runs:
  using: composite
  steps:
    - name: Wait for and restore PHP build
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PHP_BUILD_ARTIFACT_NAME: ${{ inputs.name }}
        PHP_BUILD_PRODUCER_JOB: ${{ inputs.producer_job }}
        PHP_BUILD_SOURCE_SHA: ${{ inputs.source_sha }}
      run: .github/scripts/download_build_artifact.sh
