name: Test
inputs:
  runTestsParameters:
    default: ''
    required: false
  enableOpcache:
    default: 'false'
    required: false
  jitType:
    default: 'disable'
    required: false
  testShard:
    default: 1
    required: false
  testShards:
    default: 1
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TEST_SHARD: ${{ inputs.testShard }}
        TEST_SHARDS: ${{ inputs.testShards }}
      run: |
        set -x
        if [[ ! $TEST_SHARD =~ ^[1-9][0-9]*$ || ! $TEST_SHARDS =~ ^[1-9][0-9]*$ || $TEST_SHARD -gt $TEST_SHARDS ]]; then
          echo "Invalid test shard $TEST_SHARD of $TEST_SHARDS" >&2
          exit 1
        fi
        export SKIP_IO_CAPTURE_TESTS=1
        export STACK_LIMIT_DEFAULTS_CHECK=1
        test_shard_options=()
        if [[ $TEST_SHARDS -gt 1 ]]; then
          sapi/cli/php .github/scripts/generate_test_shard.php \
            "$TEST_SHARD" "$TEST_SHARDS" "$RUNNER_TEMP/php-test-shard.txt"
          test_shard_options=(-r "$RUNNER_TEMP/php-test-shard.txt")
        fi
        cpu_usage_usec() {
          if [[ -r /sys/fs/cgroup/cpu.stat ]]; then
            awk '$1 == "usage_usec" { print $2 }' /sys/fs/cgroup/cpu.stat
          elif [[ -r /sys/fs/cgroup/cpuacct/cpuacct.usage ]]; then
            awk '{ print int($1 / 1000) }' /sys/fs/cgroup/cpuacct/cpuacct.usage
          else
            printf ''
          fi
        }
        cpu_usage_before=$(cpu_usage_usec)
        TIMEFORMAT='Resource timing: real=%3R user=%3U sys=%3S cpu=%P'
        time sapi/cli/php run-tests.php -P -q ${{ inputs.runTestsParameters }} \
          ${{ inputs.enableOpcache == 'true' && '-d opcache.enable_cli=1' || '' }} \
          -d opcache.jit=${{ inputs.jitType }} \
          -d opcache.jit_buffer_size=64M \
          -j$(nproc) \
          -g FAIL,BORK,LEAK,XLEAK \
          --no-progress \
          --show-diff \
          --show-slow 1000 \
          --set-timeout 120 \
          "${test_shard_options[@]}"
        cpu_usage_after=$(cpu_usage_usec)
        if [[ -n $cpu_usage_before && -n $cpu_usage_after ]]; then
          printf 'Cgroup CPU timing: usage=%.3f\n' \
            "$((cpu_usage_after - cpu_usage_before))e-6"
        fi
